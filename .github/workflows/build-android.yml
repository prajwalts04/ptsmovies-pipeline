name: Build and Deploy PTS Suite APK to Pi

on:
  push:
    branches: [ main, master, android-app ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Android Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Cache Debug Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: debug-keystore-v1

      - name: Build Android Release APK
        run: |
          gradle assembleRelease --stacktrace

      - name: Deploy APK Directly to Pi Server (No GitHub Releases)
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            echo "Found APK: $APK_FILE ($(du -h "$APK_FILE" | cut -f1))"
            echo "Deploying directly to Pi server at hub.ptsmovies.online..."
            curl -k -X POST --data-binary @"$APK_FILE" \
              -H "Content-Type: application/vnd.android.package-archive" \
              https://hub.ptsmovies.online/api/app/upload-apk
          else
            echo "Error: Release APK not generated!"
            exit 1
          fi

      - name: Secondary Backup Upload to Hugging Face
        if: always()
        run: |
          APK_FILE=$(find app/build/outputs/apk/release -name "*.apk" | head -n 1)
          if [ -f "$APK_FILE" ]; then
            pip install huggingface_hub
            python -c "
          from huggingface_hub import HfApi
          import os
          token = os.environ.get('HF_TOKEN')
          if token:
              api = HfApi(token=token)
              api.upload_file(
                  path_or_fileobj='$APK_FILE',
                  path_in_repo='temp_transcodes/PTS-Suite.apk',
                  repo_id='Ptsts1998/temp',
                  repo_type='dataset'
              )
              print('Backup uploaded to Hugging Face.')
          "
          fi
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
