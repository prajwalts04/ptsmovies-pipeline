name: Media Processing Pipeline
on:
  workflow_dispatch:
    inputs:
      job_id:
        required: true
        type: string
      url:
        required: true
        type: string
      callback_url:
        required: true
        type: string

jobs:
  process:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies
        run: |
          sudo apt-get update && sudo apt-get install -y ffmpeg aria2
          pip install yt-dlp huggingface_hub requests
      - name: Run Pipeline
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_DATASET: ${{ secrets.HF_DATASET }}
        run: |
          python scripts/pipeline/process.py \
            --job-id "${{ github.event.inputs.job_id }}" \
            --url "${{ github.event.inputs.url }}" \
            --callback-url "${{ github.event.inputs.callback_url }}"
